#! clean build -g 0 -W 9 -O 9

name: lang.python3
version: master

parent: base
src: mod.cpp
mode: shared

profile:
- name: base
  dep: mkn.mod
  if_dep:
    bsd: parse.yaml[lib]
    win: parse.yaml[lib]
  if_arg:
    shared: -DMKN_KUL_SHARED
    win_static: -DYAML_CPP_STATIC_DEFINE

- name: format
  mod: |
    clang.format{init:{style: google, paths: .}}
